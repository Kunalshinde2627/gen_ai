
services:
  api:
    build: .
    container_name: taxsaathi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    build: .
    container_name: taxsaathi-ui
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/agent
    volumes:
      - ./data:/app/data
    depends_on:
      - api
